server {
    listen 80;
    server_name expense-lite.test localhost 127.0.0.1;
    server_tokens off;

    return 301 https://expense-lite.test$request_uri;
}

server {
    listen 443 ssl;
    server_name expense-lite.test localhost 127.0.0.1;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/expense-lite.test.crt;
    ssl_certificate_key /etc/nginx/certs/expense-lite.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $web_backend "http://web:8000";
        proxy_pass $web_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
